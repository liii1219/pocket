<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket — MVP</title>
<style>
  :root { --bg:#12161c; --panel:#1b212a; --line:#2b3440;
          --ink:#eef2f6; --muted:#93a1b1; --accent:#7ddcbe; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:460px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:26px; margin:0 0 6px; }
  h2 { font-size:32px; margin:0 0 4px; }
  p.muted { color:var(--muted); margin:0 0 28px; }
  button { font:inherit; border-radius:14px; border:1px solid var(--line);
           background:var(--panel); color:var(--ink); padding:22px; cursor:pointer; width:100%; }
  .times { display:flex; flex-direction:column; gap:12px; }
  .times button { font-size:22px; font-weight:650; }
  .times span { color:var(--muted); font-size:15px; font-weight:400; display:block; margin-top:2px; }
  .primary { background:var(--accent); color:#10231d; border-color:transparent;
             font-weight:650; font-size:18px; margin-top:24px; }
  .back { background:none; border:none; color:var(--muted); width:auto;
          padding:0 0 20px; text-align:left; }
  .cues { display:flex; gap:8px; margin:14px 0 0; flex-wrap:wrap; }
  .cues span { background:var(--panel); border:1px solid var(--line); border-radius:999px;
               padding:6px 13px; font-size:15px; color:var(--muted); }
  .dose { color:var(--accent); font-size:17px; margin:2px 0 0; }
  .stop { color:var(--muted); font-size:14px; margin:22px 0 0;
          border-left:2px solid #f0b866; padding-left:12px; }
  .progress { color:var(--muted); font-size:14px; margin:0 0 26px; }
  .done { text-align:center; padding-top:60px; }
  .fine { color:var(--muted); font-size:13px; margin-top:40px;
          border-top:1px solid var(--line); padding-top:14px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================================
   Pocket MVP.

   One question: how long have you got right now.
   No calendar, no account, no setup. The interviews said the barrier is
   everything that happens before the first repetition, so there is nothing
   before the first repetition.
   ========================================================================= */

const MOVEMENTS = [
  { name:'Neck release',       cues:['Ear to shoulder','Breathe out'],
    dose:'40 seconds each side', secs:50,
    stopIf:'Never force it. Do not pull with your hand.' },
  { name:'Chair squat',        cues:['Sit back','Chest up'],
    dose:'10 reps', secs:70,
    stopIf:'Stop if your knees hurt at the bottom.' },
  { name:'Wall push-up',       cues:['Elbows in','Body in a line'],
    dose:'10 reps', secs:70,
    stopIf:'Stop if your shoulder pinches at the top.' },
  { name:'Standing hip hinge', cues:['Push hips back','Flat back'],
    dose:'8 reps', secs:70,
    stopIf:'Stop the moment your lower back rounds.' },
  { name:'Calf raise',         cues:['Slow up','Slower down'],
    dose:'15 reps', secs:60,
    stopIf:'Stop if your achilles feels sharp rather than tired.' },
];

// One minute is kept back so the session ends before the gap does.
const BUFFER = 60;

// Deterministic: five minutes always gives the same session, so a demo repeats.
function plan(minutes) {
  const budget = minutes * 60 - BUFFER;
  const out = [];
  let spent = 0;
  for (const m of MOVEMENTS) {
    if (spent + m.secs > budget) break;
    out.push(m);
    spent += m.secs;
  }
  return out;
}

const state = { screen:'home', minutes:0, list:[], at:0 };
const app = document.getElementById('app');

function go(patch) { Object.assign(state, patch); render(); }

function render() {
  if (state.screen === 'home') {
    app.innerHTML =
      '<h1>Pocket</h1>' +
      '<p class="muted">How long have you got right now?</p>' +
      '<div class="times">' +
        [5, 10].map(m =>   // the interviews said five to ten; longer was called unrealistic
          '<button data-min="' + m + '">' + m + ' minutes' +
          '<span>' + plan(m).length + ' movements</span></button>'
        ).join('') +
      '</div>' +
      '<p class="fine">No account, no setup, nothing to install. ' +
      'Do it in the clothes you are wearing.</p>';
    return;
  }

  if (state.screen === 'done') {
    app.innerHTML =
      '<div class="done"><h2>Done.</h2>' +
      '<p class="muted">That was ' + state.minutes + ' minutes you were not using.</p>' +
      '<button class="primary" data-home="1">Back</button></div>';
    return;
  }

  const m = state.list[state.at];
  app.innerHTML =
    '<button class="back" data-home="1">← Back</button>' +
    '<p class="progress">Movement ' + (state.at + 1) + ' of ' + state.list.length + '</p>' +
    '<h2>' + m.name + '</h2>' +
    '<p class="dose">' + m.dose + '</p>' +
    '<div class="cues"><span>' + m.cues[0] + '</span><span>' + m.cues[1] + '</span></div>' +
    '<p class="stop">' + m.stopIf + '</p>' +
    '<button class="primary" data-next="1">' +
      (state.at === state.list.length - 1 ? 'Finish' : 'Next movement') +
    '</button>';
}

app.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.min)  go({ screen:'session', minutes:+b.dataset.min, list:plan(+b.dataset.min), at:0 });
  else if (b.dataset.home) go({ screen:'home' });
  else if (b.dataset.next) {
    if (state.at === state.list.length - 1) go({ screen:'done' });
    else go({ at: state.at + 1 });
  }
});

render();
</script>
</body>
</html>
